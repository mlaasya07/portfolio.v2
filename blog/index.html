<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/jpeg" href="pfp.jpg">

  <title>Writing | Laasya</title>

  <meta
    name="description"
    content="Writing by Laasya — ideas, experiments, learning and things I'm figuring out."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root {
      --white: hsl(0, 0%, 94%);
      --black: hsl(0, 0%, 8%);
      --gray: hsl(0, 0%, 42%);
      --muted: hsl(0, 0%, 60%);
      --secondary: hsl(0, 0%, 16%);
      --border: hsl(0, 0%, 20%);

      --pink: hsl(340, 82%, 65%);
      --green: hsl(142, 70%, 55%);
      --blue: hsl(202, 93%, 58%);
      --yellow: hsl(42, 79%, 64%);
      --highlight: hsl(75, 100%, 30%);
    }


    /* =========================================================
       BASE
       ========================================================= */

    html {
      font-family: "JetBrains Mono", monospace;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--black);
      color: var(--white);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: var(--highlight);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }


    /* =========================================================
       LAYOUT
       ========================================================= */

    .container {
      width: min(100% - 3rem, 48rem);
      margin: 0 auto;

      padding: 3rem 0 6rem;
    }

    @media (min-width: 640px) {
      .container {
        padding-top: 5rem;
      }
    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 5rem;

      font-size: 0.8rem;
    }

    .brand {
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;

      color: var(--muted);
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }


    /* =========================================================
       ARTICLE HEADER
       ========================================================= */

    .article-header {
      margin-bottom: 4rem;
    }

    .article-category {
      color: var(--yellow);

      font-size: 0.75rem;
      text-transform: lowercase;

      margin-bottom: 1.25rem;
    }

    .article-title {
      margin: 0;

      max-width: 48rem;

      font-size: clamp(2.2rem, 7vw, 4.2rem);
      line-height: 1.05;

      letter-spacing: -0.07em;
      font-weight: 700;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;

      margin-top: 1.5rem;

      color: var(--muted);
      font-size: 0.7rem;
    }

    .article-meta .dot {
      color: var(--gray);
    }


    /* =========================================================
       ARTICLE CONTENT
       ========================================================= */

    .article {
      border-top: 1px solid var(--border);

      padding-top: 3rem;
    }

    .article-content {
      color: hsl(0, 0%, 82%);

      font-size: 0.9rem;
      line-height: 2;
    }

    .article-content p {
      margin: 0 0 1.8rem;
    }

    .article-content h2 {
      margin: 3.5rem 0 1.25rem;

      color: var(--white);

      font-size: 1.25rem;
      line-height: 1.4;
    }

    .article-content h3 {
      margin: 2.5rem 0 1rem;

      color: var(--white);

      font-size: 1rem;
      line-height: 1.5;
    }

    .article-content strong {
      color: var(--white);
      font-weight: 700;
    }

    .article-content em {
      color: var(--yellow);
    }

    .article-content a {
      color: var(--yellow);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-content a:hover {
      color: var(--white);
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 2rem;
      padding-left: 1.5rem;
    }

    .article-content li {
      margin-bottom: 0.75rem;
    }

    .article-content blockquote {
      margin: 2.5rem 0;

      padding: 0.5rem 0 0.5rem 1.5rem;

      border-left: 2px solid var(--yellow);

      color: var(--muted);

      font-style: italic;
    }

    .article-content code {
      padding: 0.15rem 0.35rem;

      background: var(--secondary);
      border: 1px solid var(--border);

      color: var(--yellow);

      font-size: 0.8em;
    }

    .article-content pre {
      overflow-x: auto;

      margin: 2rem 0;
      padding: 1.25rem;

      background: hsl(0, 0%, 11%);
      border: 1px solid var(--border);

      line-height: 1.7;
    }

    .article-content pre code {
      padding: 0;

      background: transparent;
      border: 0;

      color: var(--white);
    }

    .article-content hr {
      margin: 3.5rem 0;

      border: 0;
      border-top: 1px solid var(--border);
    }

    .article-content img {
      display: block;

      width: 100%;
      height: auto;

      margin: 2.5rem 0;

      border: 1px solid var(--border);
    }


    /* =========================================================
       SUBSTACK BUTTON
       ========================================================= */

    .source-box {
      margin-top: 4rem;

      padding: 1.5rem;

      border: 1px solid var(--border);

      background: hsl(0, 0%, 10%);
    }

    .source-label {
      margin-bottom: 0.75rem;

      color: var(--muted);

      font-size: 0.7rem;
    }

    .source-link {
      display: inline-block;

      color: var(--yellow);

      font-size: 0.8rem;

      transition: transform 0.2s ease;
    }

    .source-link:hover {
      transform: translateX(0.3rem);
    }


    /* =========================================================
       ARTICLE NAVIGATION
       ========================================================= */

    .article-navigation {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 1rem;

      margin-top: 5rem;

      padding-top: 1.5rem;

      border-top: 1px solid var(--border);
    }

    .nav-post {
      display: block;

      padding: 1rem 0;

      transition: transform 0.2s ease;
    }

    .nav-post:hover {
      transform: translateX(0.25rem);
    }

    .nav-post.next {
      text-align: right;
    }

    .nav-direction {
      display: block;

      margin-bottom: 0.6rem;

      color: var(--muted);

      font-size: 0.65rem;
    }

    .nav-title {
      color: var(--white);

      font-size: 0.75rem;
      line-height: 1.6;
    }

    .nav-post:hover .nav-title {
      color: var(--yellow);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      display: flex;

      justify-content: space-between;

      margin-top: 4rem;
      padding-top: 1.5rem;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 0.7rem;
    }

    footer a:hover {
      color: var(--yellow);
    }


    /* =========================================================
       ERROR
       ========================================================= */

    .error {
      padding: 3rem 0;

      color: var(--muted);

      font-size: 0.8rem;
      line-height: 1.8;
    }

    .error a {
      color: var(--yellow);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 560px) {

      .container {
        width: min(100% - 2rem, 48rem);

        padding-top: 3rem;
      }

      .top-nav {
        margin-bottom: 4rem;
      }

      .nav-links {
        gap: 0.75rem;
      }

      .article-title {
        font-size: 2.5rem;
      }

      .article-content {
        font-size: 0.85rem;
        line-height: 1.9;
      }

      .article-navigation {
        grid-template-columns: 1fr;
      }

      .nav-post.next {
        text-align: left;
      }

      footer {
        flex-direction: column;

        gap: 0.75rem;
      }
    }

  </style>
</head>


<body>

  <main class="container">


    <!-- =======================================================
         NAVIGATION
         ======================================================= -->

    <nav class="top-nav">

      <a href="index.html" class="brand">
        mlaasya07
      </a>

      <div class="nav-links">

        <a href="index.html">
          writing
        </a>

        <a
          href="https://mlaasya07.substack.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          substack ↗
        </a>

      </div>

    </nav>


    <!-- =======================================================
         ARTICLE
         ======================================================= -->

    <article id="article">

      <!-- Filled by JavaScript -->

    </article>


    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <footer>

      <a href="index.html">
        ← all writing
      </a>

      <a
        href="https://mlaasya07.substack.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        read on substack ↗
      </a>

    </footer>


  </main>


  <script>

    /*
      ==========================================================
      BLOG POSTS
      ==========================================================

      Each post needs a unique "id".

      Example URL:

      blog.html?id=ai-leverage

      ----------------------------------------------------------

      source:

      "local"
        → article is displayed on your website

      "substack"
        → sends the reader directly to Substack

      "local-substack"
        → displays article here AND gives a
          "Read on Substack" button

      ==========================================================
    */


    const posts = [

      {
        id: "ai-leverage",

        title:
          "AI Is Not Coming for Jobs. It Is Coming for Leverage.",

        date:
          "Aug 24, 2026",

        category:
          "ideas",

        readTime:
          "7 min read",

        source:
          "local-substack",

        substack:
          "https://mlaasya07.substack.com/p/ai-is-not-coming-for-jobs",

        content: `

          <p>
            The interesting question isn't whether AI replaces me.
            It's what I can do now that I couldn't do before.
          </p>

          <p>
            <!-- PUT THE REST OF YOUR BLOG HERE -->
          </p>

          <h2>
            The real shift
          </h2>

          <p>
            <!-- YOUR ARTICLE CONTENT -->
          </p>

          <p>
            <!-- YOUR ARTICLE CONTENT -->
          </p>

          <h2>
            Leverage
          </h2>

          <p>
            <!-- YOUR ARTICLE CONTENT -->
          </p>

        `
      },


      {
        id: "learning-in-public",

        title:
          "learning in public",

        date:
          "Aug 18, 2026",

        category:
          "learning",

        readTime:
          "4 min read",

        source:
          "local",

        content: `

          <p>
            I've been thinking about what it actually means
            to learn in public.
          </p>

          <p>
            This website is partly an experiment in doing that.
            I don't want it to be just a list of projects I've
            completed or technologies I've used.
          </p>

          <h2>
            Why I'm doing this
          </h2>

          <p>
            <!-- YOUR ARTICLE CONTENT -->
          </p>

          <p>
            <!-- YOUR ARTICLE CONTENT -->
          </p>

        `
      }

    ];


    /*
      ==========================================================
      GET POST ID
      ==========================================================
    */

    const params =
      new URLSearchParams(window.location.search);

    const postId =
      params.get("id");


    /*
      ==========================================================
      FIND POST
      ==========================================================
    */

    const postIndex =
      posts.findIndex(
        post => post.id === postId
      );

    const post =
      posts[postIndex];


    /*
      ==========================================================
      ARTICLE ELEMENT
      ==========================================================
    */

    const article =
      document.getElementById("article");


    /*
      ==========================================================
      INVALID POST
      ==========================================================
    */

    if (!post) {

      document.title =
        "Writing | Laasya";

      article.innerHTML = `

        <div class="error">

          <p>
            this post doesn't exist.
          </p>

          <p>
            <a href="index.html">
              ← back to writing
            </a>
          </p>

        </div>

      `;

    }


    /*
      ==========================================================
      RENDER POST
      ==========================================================
    */

    else {

      document.title =
        `${post.title} | Laasya`;


      /*
        --------------------------------------------------------
        PREVIOUS POST
        --------------------------------------------------------
      */

      const previousPost =
        postIndex > 0
          ? posts[postIndex - 1]
          : null;


      /*
        --------------------------------------------------------
        NEXT POST
        --------------------------------------------------------
      */

      const nextPost =
        postIndex < posts.length - 1
          ? posts[postIndex + 1]
          : null;


      /*
        --------------------------------------------------------
        SUBSTACK SOURCE
        --------------------------------------------------------
      */

      let sourceBox = "";


      if (
        post.substack &&
        (
          post.source === "local-substack" ||
          post.source === "substack"
        )
      ) {

        sourceBox = `

          <div class="source-box">

            <div class="source-label">
              originally published on
            </div>

            <a
              class="source-link"
              href="${post.substack}"
              target="_blank"
              rel="noopener noreferrer"
            >
              read the original on substack ↗
            </a>

          </div>

        `;

      }


      /*
        --------------------------------------------------------
        SUBSTACK-ONLY POST
        --------------------------------------------------------
      */

      if (post.source === "substack") {

        article.innerHTML = `

          <header class="article-header">

            <div class="article-category">
              / ${post.category}
            </div>

            <h1 class="article-title">
              ${post.title}
            </h1>

            <div class="article-meta">

              <span>
                ${post.date}
              </span>

              <span class="dot">
                ·
              </span>

              <span>
                ${post.readTime}
              </span>

            </div>

          </header>


          <div class="article">

            <div class="article-content">

              <p>
                This article is published on Substack.
              </p>

              <p>
                You can read the complete article there.
              </p>

              <div class="source-box">

                <div class="source-label">
                  full article
                </div>

                <a
                  class="source-link"
                  href="${post.substack}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  read on substack ↗
                </a>

              </div>

            </div>

          </div>

        `;

      }


      /*
        --------------------------------------------------------
        LOCAL ARTICLE
        --------------------------------------------------------
      */

      else {

        article.innerHTML = `

          <header class="article-header">

            <div class="article-category">
              / ${post.category}
            </div>

            <h1 class="article-title">
              ${post.title}
            </h1>

            <div class="article-meta">

              <span>
                ${post.date}
              </span>

              <span class="dot">
                ·
              </span>

              <span>
                ${post.readTime}
              </span>

            </div>

          </header>


          <div class="article">

            <div class="article-content">

              ${post.content}

            </div>

            ${sourceBox}


            <nav class="article-navigation">


              ${
                previousPost
                  ? `

                    <a
                      class="nav-post previous"
                      href="blog.html?id=${previousPost.id}"
                    >

                      <span class="nav-direction">
                        ← previous
                      </span>

                      <span class="nav-title">
                        ${previousPost.title}
                      </span>

                    </a>

                  `
                  : `<div></div>`
              }


              ${
                nextPost
                  ? `

                    <a
                      class="nav-post next"
                      href="blog.html?id=${nextPost.id}"
                    >

                      <span class="nav-direction">
                        next →
                      </span>

                      <span class="nav-title">
                        ${nextPost.title}
                      </span>

                    </a>

                  `
                  : `<div></div>`
              }


            </nav>

          </div>

        `;

      }

    }

  </script>

</body>
</html>
