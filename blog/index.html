  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --white: hsl(0, 0%, 94%);
      --black: hsl(0, 0%, 8%);
      --gray: hsl(0, 0%, 42%);
      --muted: hsl(0, 0%, 60%);
      --secondary: hsl(0, 0%, 16%);
      --border: hsl(0, 0%, 20%);

      --pink: hsl(340, 82%, 65%);
      --green: hsl(142, 70%, 55%);
      --blue: hsl(202, 93%, 58%);
      --yellow: hsl(42, 79%, 64%);
      --highlight: hsl(75, 100%, 30%);
    }

    html {
      font-family: "JetBrains Mono", monospace;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--highlight);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(100% - 3rem, 42rem);
      margin: 0 auto;
      padding: 3rem 0 6rem;
    }

    @media (min-width: 640px) {
      .container {
        padding-top: 5rem;
      }
    }

    /* NAVIGATION */

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5rem;
      font-size: 0.8rem;
    }

    .brand {
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      color: var(--muted);
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }

    /* HERO */

    .eyebrow {
      color: var(--yellow);
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }

    .hero {
      margin-bottom: 3.5rem;
    }

    .hero h1 {
      margin: 0 0 1.25rem;
      max-width: 40rem;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.07em;
    }

    .hero p {
      max-width: 36rem;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.8;
    }

    /* CONTROLS */

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter:hover,
    .filter.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: var(--black);
    }

    .search {
      width: 100%;
      padding: 0.75rem 0;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      background: transparent;
      color: var(--white);
    }

    .search:focus {
      border-color: var(--yellow);
    }

    .search::placeholder {
      color: var(--gray);
    }

    /* POSTS */

    .posts {
      border-top: 1px solid var(--border);
    }

    .post {
      display: block;
      border-bottom: 1px solid var(--border);
      padding: 1.75rem 0;
      transition: transform 0.25s ease;
    }

    .post:hover {
      transform: translateX(0.4rem);
    }

    .post-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .post h2 {
      margin: 0.75rem 0 0.6rem;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .post:hover h2 {
      color: var(--yellow);
    }

    .post-excerpt {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.8;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: 0.7rem;
    }

    .category {
      color: var(--green);
    }

    .read {
      color: var(--muted);
    }

    .empty {
      padding: 3rem 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* FOOTER */

    footer {
      display: flex;
      justify-content: space-between;
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.7rem;
    }

    footer a:hover {
      color: var(--yellow);
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 2rem, 42rem);
      }

      .top-nav {
        margin-bottom: 4rem;
      }

      .nav-links {
        gap: 0.75rem;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      footer {
        flex-direction: column;
        gap: 0.75rem;
      }
    }
  </style>

</head>

  </main>

  <script>

    /*
      ==========================================================
      BLOG POSTS
      ==========================================================

      Add new posts inside this array.

      You don't need to create a new HTML file for every post.
      ==========================================================
    */

    const posts = [

      {
        title:
          "AI Is Not Coming for Jobs. It Is Coming for Leverage.",

        date:
          "Aug 24, 2026",

        category:
          "ideas",

        readTime:
          "7 min read",

        excerpt:
          "The interesting question isn't whether AI replaces me. It's what I can do now that I couldn't do before.",

        url:
          "https://mlaasya07.substack.com/p/ai-is-not-coming-for-jobs"
      },


      {
        title:
          "learning in public",

        date:
          "Aug 18, 2026",

        category:
          "learning",

        readTime:
          "4 min read",

        excerpt:
          "Why I want this site to be more than a list of projects.",

        url:
          "#"
      }

    ];


    /*
      ==========================================================
      STATE
      ==========================================================
    */

    let activeCategory = "all";
    let searchQuery = "";


    /*
      ==========================================================
      CATEGORIES
      ==========================================================
    */

    function renderFilters() {

      const filters =
        document.getElementById("filters");

      const categories = [
        "all",
        ...new Set(
          posts.map(post => post.category)
        )
      ];

      filters.innerHTML =
        categories.map(category => `

          <button
            class="filter ${
              activeCategory === category
                ? "active"
                : ""
            }"
            data-category="${category}"
          >
            ${category}
          </button>

        `).join("");


      filters
        .querySelectorAll(".filter")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              activeCategory =
                button.dataset.category;

              renderFilters();
              renderPosts();

            }
          );

        });

    }


    /*
      ==========================================================
      POSTS
      ==========================================================
    */

    function renderPosts() {

      const container =
        document.getElementById("posts");

      const filteredPosts =
        posts.filter(post => {

          const matchesCategory =
            activeCategory === "all" ||
            post.category === activeCategory;

          const searchable =
            `
              ${post.title}
              ${post.excerpt}
              ${post.category}
            `.toLowerCase();

          const matchesSearch =
            searchable.includes(
              searchQuery.toLowerCase()
            );

          return (
            matchesCategory &&
            matchesSearch
          );

        });


      if (!filteredPosts.length) {

        container.innerHTML = `

          <div class="empty">
            nothing found.
          </div>

        `;

        return;

      }


      container.innerHTML =
        filteredPosts.map(post => `

          <a
            class="post"
            href="${post.url}"
            ${
              post.url.startsWith("http")
                ? 'target="_blank" rel="noopener noreferrer"'
                : ""
            }
          >

            <div class="post-meta">

              <span>
                ${post.date}
              </span>

              <span>·</span>

              <span>
                ${post.readTime}
              </span>

            </div>


            <h2>
              ${post.title}
            </h2>


            <p class="post-excerpt">
              ${post.excerpt}
            </p>


            <div class="post-footer">

              <span class="category">
                ${post.category}
              </span>

              <span class="read">
                read →
              </span>

            </div>

          </a>

        `).join("");

    }


    /*
      ==========================================================
      SEARCH
      ==========================================================
    */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        event => {

          searchQuery =
            event.target.value;

          renderPosts();

        }
      );


    /*
      ==========================================================
      INITIALISE
      ==========================================================
    */

    renderFilters();
    renderPosts();

  </script>
