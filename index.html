<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0a0d0f; --panel:#101416; --panel-2:#0d1113;
    --line: rgba(237,234,233,0.09);
    --fg:#EDEAE9; --muted:#8b9089;
    --crimson:#C42847; --crimson-soft: rgba(196,40,71,0.14);
    --sage:#B5BD89; --sage-soft: rgba(181,189,137,0.14);
    --steel:#84ACCE; --steel-soft: rgba(132,172,206,0.14);
    --serif:'Cormorant Garamond', Georgia, serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --radius: 1.1rem;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--fg); font-family:var(--mono); -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; }
  input, textarea{ user-select:text !important; -webkit-user-select:text !important; -moz-user-select:text !important; }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--crimson); color:var(--fg);}
  button{font-family:inherit;}

  .bg-grid{ position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: linear-gradient(rgba(237,234,233,0.028) 1px, transparent 1px), linear-gradient(90deg, rgba(237,234,233,0.028) 1px, transparent 1px);
    background-size:42px 42px; mask-image: radial-gradient(circle at 50% 15%, black, transparent 75%); }

  .wrap{max-width:74rem; margin:0 auto; padding:0 1.25rem;}

  /* ══════════ boot preloader ══════════ */
  .preloader{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:1.25rem;
    transition:opacity .4s ease, visibility .4s ease; }
  .preloader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .preloader-term{ width:min(90vw, 23rem); border:1px solid var(--line); border-radius:0.9rem; background:var(--panel); overflow:hidden; box-shadow:0 30px 70px -25px rgba(0,0,0,0.7); }
  @media (prefers-reduced-motion: reduce){ .preloader{ transition:none; } }

  /* ══════════ TOP NAV (full multi-page bar) ══════════ */
  .topnav{
    position:sticky; top:0; z-index:50;
    padding-top: env(safe-area-inset-top, 0px);
    background:rgba(10,13,15,0.7); backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{ display:flex; align-items:center; justify-content:space-between; padding:0.85rem 1.25rem; max-width:74rem; margin:0 auto; }
  .brand{ font-family:var(--serif); font-style:italic; font-weight:700; font-size:1.15rem; }
  .brand span{ color:var(--crimson); }
  .navlinks{ display:flex; align-items:center; gap:0.2rem; }
  .navlinks a{ font-size:0.78rem; color:var(--muted); padding:0.5rem 0.85rem; border-radius:999px; transition:color .2s ease, background .2s ease; cursor:pointer; }
  .navlinks a:hover{ color:var(--fg); }
  .navlinks a.active{ color:var(--bg); background:var(--fg); }
  .nav-toggle{ display:none; width:2.4rem; height:2.4rem; border:1px solid var(--line); border-radius:0.6rem; background:transparent; color:var(--fg); align-items:center; justify-content:center; cursor:pointer; }
  .nav-toggle svg{ width:1.1rem; height:1.1rem; }
  @media(max-width:760px){
    .navlinks{ position:fixed; top:3.6rem; left:1.25rem; right:1.25rem; flex-direction:column; align-items:stretch;
      background:rgba(16,20,22,0.96); border:1px solid var(--line); border-radius:1rem; padding:0.5rem;
      transform:translateY(-8px); opacity:0; pointer-events:none; transition:transform .2s ease, opacity .2s ease; }
    .navlinks.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
    .navlinks a{ text-align:left; padding:0.75rem 0.9rem; }
    .nav-toggle{ display:flex; }
  }

  main{ padding: 2.25rem 0 0; min-height: 70vh; }
  .page{ transition:opacity .32s ease, transform .32s ease, filter .3s ease; }
  .page.leaving{ opacity:0; transform:translateY(10px); filter:blur(6px); }
  .page.entering{ opacity:0; transform:translateY(10px); filter:blur(6px); }
  .page.shown{ opacity:1; transform:translateY(0); filter:blur(0); }
  @media (prefers-reduced-motion: reduce){ .page{transition:none !important;} }

  .reveal{ opacity:0; transform:translateY(14px); animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise{ to{opacity:1; transform:translateY(0);} }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); position:relative; overflow:hidden; }

  /* ══════════ HOME BENTO ══════════ */
  .bento{ display:grid; gap:0.9rem; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(84px, auto); }

  .c-profile{ grid-column: 3 / span 7; grid-row: 1 / span 2; padding:1.6rem 1.8rem; display:flex; gap:1.5rem; align-items:center; }
  .p-photo{ width:5.5rem; height:5.5rem; border-radius:50%; object-fit:cover; filter:grayscale(60%); flex-shrink:0; border:1px solid var(--line); }
  .p-name{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.7rem; line-height:1.05; }
  .p-handle{ color:var(--steel); font-size:0.85rem; margin-top:0.15rem; }
  .p-tagline{ color:var(--muted); font-size:0.85rem; margin-top:0.6rem; line-height:1.5; max-width:32rem;}
  .p-typed{ color:var(--crimson); font-weight:500; }
  .p-cursor{ color:var(--crimson); animation: blink 1s infinite; }
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  .p-status{ display:flex; align-items:center; gap:0.4rem; font-size:0.72rem; color:var(--muted); margin-top:0.7rem;}
  .p-dot{ width:0.4rem; height:0.4rem; border-radius:50%; background:var(--sage); box-shadow:0 0 0 3px var(--sage-soft); }

  .c-resume{ grid-column: 1 / span 2; grid-row: 1 / span 5; padding:1.3rem 1.1rem; display:flex; flex-direction:column; }
  .c-resume h2{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.5rem; line-height:1.05; margin-bottom:1rem; }
  .resume-line{ display:flex; gap:0.6rem; padding:0.55rem 0; border-top:1px solid var(--line); }
  .resume-line:first-of-type{ border-top:none; }
  .resume-dot{ width:0.4rem; height:0.4rem; border-radius:50%; margin-top:0.35rem; flex-shrink:0; }
  .resume-role{ font-size:0.75rem; font-weight:500; }
  .resume-org{ font-size:0.68rem; color:var(--muted); }
  .resume-cta{ margin-top:auto; padding-top:1rem; font-size:0.72rem; color:var(--steel); display:flex; align-items:center; gap:0.35rem; }
  .resume-cta svg{ width:0.85rem; height:0.85rem; }

  .c-terminal{ grid-column: 3 / span 4; grid-row: 3 / span 3; display:flex; flex-direction:column; padding:0; cursor:pointer; }
  .term-header{ display:flex; align-items:center; gap:0.4rem; padding:0.65rem 0.9rem; border-bottom:1px solid var(--line); }
  .term-dot{ width:0.5rem; height:0.5rem; border-radius:50%; }
  .term-dot.c1{ background:var(--crimson); } .term-dot.c2{ background:var(--sage); } .term-dot.c3{ background:var(--steel); }
  .term-header span{ margin-left:0.4rem; font-size:0.62rem; color:var(--muted); }
  .term-body{ padding:1rem 1.1rem; font-size:0.72rem; line-height:1.9; flex:1; max-height:12.5rem; overflow-y:auto; cursor:default; }
  .term-prompt{ color:var(--sage); margin-right:0.4rem; }
  .term-output{ color:var(--muted); display:block; margin-bottom:0.55rem; padding-left:1.15rem; }
  .term-cursor{ display:inline-block; width:0.45rem; height:0.9rem; background:var(--crimson); vertical-align:middle; animation: blink 1s infinite; margin-left:0.1rem; }
  .term-ask-hint{ margin-top:0.35rem; cursor:pointer; font-size:0.64rem; color:var(--steel); }
  .term-ask-hint:hover{ text-decoration:underline; }
  .term-menu-intro{ color:var(--muted); font-size:0.66rem; margin-bottom:0.5rem; padding-left:0; }
  .term-menu-item{ display:flex; gap:0.4rem; padding:0.32rem 0; color:var(--muted); cursor:pointer; font-size:0.71rem; transition:color .15s ease; }
  .term-menu-item:hover{ color:var(--fg); }
  .term-menu-item .num{ color:var(--steel); flex-shrink:0; }
  .term-answer-q{ margin-bottom:0.4rem; }
  .term-answer-block{ padding-left:1.15rem; }
  .term-back{ color:var(--steel); cursor:pointer; font-size:0.66rem; margin-top:0.3rem; display:inline-block; padding-left:1.15rem; }
  .term-back:hover{ text-decoration:underline; }
  .term-dock{ display:flex; gap:0.5rem; padding:0.75rem 0.9rem; border-top:1px solid var(--line); }
  .term-dock a{ width:2rem; height:2rem; border-radius:0.55rem; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:color .2s ease, border-color .2s ease, transform .2s ease; }
  .term-dock a:hover{ color:var(--fg); border-color:var(--fg); transform:translateY(-2px); }
  .term-dock svg{ width:0.95rem; height:0.95rem; }

  .c-buglog{ grid-column: 1 / -1; padding:1.2rem 1.5rem; display:flex; gap:1.2rem; align-items:flex-start; }
  @media (max-width: 880px){ .c-buglog{ flex-direction:column; } }
  .buglog-icon{ width:2.5rem; height:2.5rem; border-radius:0.7rem; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--crimson); flex-shrink:0; }
  .buglog-icon svg{ width:1.15rem; height:1.15rem; }
  .buglog-body{ flex:1; min-width:0; }
  .buglog-top{ display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; }
  .buglog-title{ font-size:0.82rem; font-weight:600; }
  .buglog-status{ font-size:0.6rem; font-weight:600; color:var(--sage); border:1px solid rgba(181,189,137,0.35); background:var(--sage-soft); padding:0.15rem 0.5rem; border-radius:999px; text-transform:uppercase; letter-spacing:0.04em; }
  .buglog-tag{ font-size:0.65rem; color:var(--muted); }
  .buglog-desc{ font-size:0.78rem; color:var(--muted); margin-top:0.5rem; line-height:1.65; max-width:52rem; }
  .buglog-link{ font-size:0.7rem; color:var(--steel); display:inline-flex; align-items:center; gap:0.3rem; margin-top:0.6rem; }
  .buglog-link svg{ width:0.75rem; height:0.75rem; }

  /* ══════════ command palette ══════════ */
  .cmdk-trigger{ display:flex; align-items:center; gap:0.4rem; font-size:0.68rem; color:var(--muted); border:1px solid var(--line); border-radius:0.5rem; padding:0.4rem 0.6rem; cursor:pointer; background:transparent; transition:border-color .2s ease, color .2s ease; }
  .cmdk-trigger:hover{ color:var(--fg); border-color:var(--fg); }
  .cmdk-kbd{ font-size:0.6rem; border:1px solid var(--line); border-radius:0.3rem; padding:0.05rem 0.3rem; }
  @media(max-width:760px){ .cmdk-trigger{ padding:0.5rem; } .cmdk-label{ display:none; } }
  .cmdk-overlay{ position:fixed; inset:0; z-index:100; background:rgba(5,7,8,0.7); backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .cmdk-overlay.open{ opacity:1; pointer-events:auto; }
  .cmdk-box{ width:100%; max-width:30rem; margin:0 1.25rem; background:var(--panel); border:1px solid var(--line); border-radius:1rem; overflow:hidden; box-shadow:0 24px 60px -20px rgba(0,0,0,0.7); transform:translateY(-8px); transition:transform .18s ease; }
  .cmdk-overlay.open .cmdk-box{ transform:translateY(0); }
  .cmdk-input{ width:100%; border:none; background:transparent; color:var(--fg); font-family:var(--mono); font-size:0.85rem; padding:1rem 1.2rem; border-bottom:1px solid var(--line); outline:none; }
  .cmdk-input::placeholder{ color:var(--muted); }
  .cmdk-list{ max-height:16rem; overflow-y:auto; padding:0.4rem; }
  .cmdk-item{ display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0.8rem; border-radius:0.6rem; font-size:0.78rem; color:var(--muted); cursor:pointer; }
  .cmdk-item.active{ background:rgba(237,234,233,0.06); color:var(--fg); }
  .cmdk-item span.hint{ font-size:0.62rem; color:var(--muted); }

  .c-mega{ grid-column: 7 / span 3; grid-row: 3 / span 3; background:linear-gradient(160deg, #17181c, var(--panel) 60%); border-color: rgba(196,40,71,0.35); padding:1.4rem; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; }
  .c-mega::before{ content:''; position:absolute; top:-30%; right:-20%; width:70%; height:70%; background:radial-gradient(circle, rgba(196,40,71,0.22), transparent 70%); pointer-events:none; }
  .mega-eyebrow{ font-size:0.68rem; color:var(--crimson); }
  .mega-title{ font-family:var(--serif); font-style:italic; font-weight:700; font-size:2.4rem; line-height:0.95; margin-top:0.35rem; }
  .mega-feature{ display:flex; align-items:center; gap:0.7rem; background:rgba(0,0,0,0.35); border:1px solid var(--line); border-radius:0.7rem; padding:0.55rem 0.7rem; margin-top:1rem; }
  .mega-feature + .mega-feature{ margin-top:0.5rem; }
  .mega-feature-name{ font-size:0.72rem; font-weight:600; }
  .mega-feature-tag{ font-size:0.6rem; color:var(--muted); }
  .mega-feature-pill{ margin-left:auto; font-size:0.6rem; background:var(--fg); color:var(--bg); padding:0.2rem 0.5rem; border-radius:999px; font-weight:600; }

  .c-links{ grid-column: 10 / span 3; grid-row: 1 / span 2; padding:1.1rem; display:flex; flex-direction:column; justify-content:center; gap:0.35rem;}
  .link-row{ display:flex; align-items:center; gap:0.6rem; font-size:0.75rem; padding:0.5rem 0.6rem; border-radius:0.6rem; transition:background .2s ease; }
  .link-row:hover{ background:rgba(237,234,233,0.05); }
  .link-row svg{ width:1rem; height:1rem; color:var(--muted); flex-shrink:0; }
  .link-row:hover svg{ color:var(--steel); }

  .c-edu{ grid-column: 10 / span 3; grid-row: 3 / span 3; padding:1.2rem; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; }
  .edu-inst{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.05rem; line-height:1.2; }
  .edu-sub{ font-size:0.68rem; color:var(--muted); margin-top:0.4rem; line-height:1.6; }
  .edu-meta{ display:flex; gap:1.2rem; margin-top:0.8rem; }
  .edu-meta div span{ display:block; font-size:0.6rem; color:var(--muted); }
  .edu-meta div b{ font-size:0.78rem; font-weight:500; }

  @media (max-width: 880px){
    .bento{ grid-template-columns:1fr; grid-auto-rows:auto; }
    .c-profile,.c-resume,.c-terminal,.c-mega,.c-links,.c-edu{ grid-column:1 / -1; grid-row:auto; }
    .c-profile{ flex-direction:column; text-align:center; }
    .p-tagline{ max-width:none; }
  }

  /* ══════════ generic page shell ══════════ */
  .page-head{ padding: 0.5rem 0 2.4rem; }
  .page-head h1{ font-family:var(--serif); font-style:italic; font-weight:700; font-size:2.3rem; }
  .page-head p{ color:var(--muted); font-size:0.82rem; margin-top:0.4rem; max-width:34rem; line-height:1.6; }
  .page-body{ padding-bottom:5rem; }

  /* ══════════ RESUME PAGE ══════════ */
  .resume-header{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem; border-bottom:1px solid var(--line); padding-bottom:1.4rem; margin-bottom:2rem; }
  .resume-header h1{ font-family:var(--serif); font-style:italic; font-weight:700; font-size:2rem; }
  .resume-header .role{ color:var(--steel); font-size:0.8rem; margin-top:0.25rem; }
  .resume-contact{ display:flex; gap:1rem; flex-wrap:wrap; font-size:0.72rem; color:var(--muted); }
  .resume-contact a:hover{ color:var(--fg); }
  .resume-download{ display:inline-flex; align-items:center; gap:0.45rem; font-size:0.72rem; font-weight:600; color:var(--bg); background:var(--fg); padding:0.5rem 0.9rem; border-radius:0.6rem; transition:opacity .2s ease; }
  .resume-download:hover{ opacity:0.85; }
  .resume-download svg{ width:0.85rem; height:0.85rem; }
  .resume-section{ margin-bottom:2.4rem; }
  .resume-section h2{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.3rem; margin-bottom:0.9rem; }
  .resume-entry{ border-left:2px solid var(--line); padding-left:1rem; margin-bottom:1.1rem; }
  .resume-entry-head{ display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .resume-entry-title{ font-size:0.85rem; font-weight:600; }
  .resume-entry-org{ font-size:0.75rem; color:var(--steel); }
  .resume-entry-date{ font-size:0.7rem; color:var(--muted); white-space:nowrap; }
  .resume-entry-desc{ font-size:0.78rem; color:var(--muted); margin-top:0.35rem; line-height:1.6; }
  .resume-placeholder{ border:1px dashed var(--line); border-radius:0.9rem; padding:1.2rem 1.4rem; color:var(--muted); font-size:0.78rem; line-height:1.7; }
  .resume-placeholder b{ color:var(--fg); }
  .resume-skill-groups{ display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
  @media(max-width:700px){ .resume-skill-groups{grid-template-columns:1fr;} }
  .resume-skill-groups h3{ font-size:0.72rem; color:var(--muted); margin-bottom:0.5rem; }
  .full-badges{ display:flex; flex-wrap:wrap; gap:0.5rem; }
  .full-badge{ font-size:0.75rem; padding:0.4rem 0.75rem; border:1px solid var(--line); border-radius:999px; color:var(--muted); transition:all .2s ease; }
  .full-badge:hover{ border-color:var(--fg); color:var(--fg); }

  /* resume widget cards */
  .resume-card{ border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.3rem; background:var(--panel); margin-bottom:1rem; transition:border-color .2s ease; }
  .resume-card:hover{ border-color:rgba(237,234,233,0.18); }
  .rc-top{ display:flex; align-items:flex-start; gap:0.8rem; justify-content:space-between; }
  .rc-head{ display:flex; align-items:flex-start; gap:0.8rem; min-width:0; }
  .rc-icon{ width:2.1rem; height:2.1rem; border-radius:0.6rem; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--steel); flex-shrink:0; }

  // ── typed effect ──────────────────────────────────
  function startTyped(el, strings){
    let si=0, ci=0, deleting=false;
    function tick(){
      const cur = strings[si];
      el.textContent = deleting ? cur.substring(0, ci-1) : cur.substring(0, ci+1);
      ci += deleting ? -1 : 1;
      let speed = deleting ? 45 : 75;
      if(!deleting && ci===cur.length){ speed=1400; deleting=true; }
      else if(deleting && ci===0){ deleting=false; si=(si+1)%strings.length; speed=400; }
      setTimeout(tick, speed);
    }
    tick();
  }

  function loadRepoLangs(){
    projects.filter(p => p.github && !p.tech).forEach(p => {
      const box = document.querySelector('.proj-chips[data-slug="' + slugify(p.name) + '"]');
      if(!box) return;
      const repo = p.github.replace('https://github.com/', '');
      const key = 'langs:' + repo;
      const paint = (l) => { box.innerHTML = l.slice(0,3).map(x => '<span class="proj-chip">' + x + '</span>').join(''); };
      let cached = null; try{ cached = JSON.parse(sessionStorage.getItem(key)); }catch(e){}
      if(cached){ paint(cached); return; }
      fetch('https://api.github.com/repos/' + repo + '/languages')
        .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => { const l = Object.keys(d); if(l.length){ paint(l); try{ sessionStorage.setItem(key, JSON.stringify(l)); }catch(e){} } })
        .catch(() => {});
    });
  }

  // ── terminal typing effect ──────────────────────────
  function typeTerminal(el, lines, onDone){
    el.innerHTML = '';
    let li = 0;
    function nextLine(){
      if(li >= lines.length){
        const cursorLine = document.createElement('div');
        const prompt = document.createElement('span');
        prompt.className = 'term-prompt'; prompt.textContent = '$';
        const cursor = document.createElement('span');
        cursor.className = 'term-cursor';
        cursorLine.appendChild(prompt); cursorLine.appendChild(cursor);
        el.appendChild(cursorLine);
        if(onDone) onDone();
        return;
      }
      const {cmd, out} = lines[li];
      const lineEl = document.createElement('div');
      const prompt = document.createElement('span');
      prompt.className = 'term-prompt'; prompt.textContent = '$';
      const cmdSpan = document.createElement('span');
      lineEl.appendChild(prompt); lineEl.appendChild(cmdSpan);
      el.appendChild(lineEl);
      let ci = 0;
      const typer = setInterval(() => {
        cmdSpan.textContent = cmd.substring(0, ci+1);
        ci++;
        if(ci === cmd.length){
          clearInterval(typer);
          setTimeout(() => {
            const outEl = document.createElement('span');
            outEl.className = 'term-output';
            outEl.innerHTML = out;
            el.appendChild(outEl);
            li++;
            setTimeout(nextLine, 350);
          }, 220);
        }
      }, 32);
    }
    nextLine();
  }

  const FEEDS = {

        const norm = (x) => (Array.isArray(x) ? x : []).filter(p => p && p.title).slice(0,3)
          .map(p => ({title:p.title, link:p.canonical_url || p.url, date:p.post_date || p.date}));
        try{
          let uid = 377255556;

          const d = await get('https://substack.com/api/v1/profile/posts?profile_user_id=' + uid + '&limit=3');
          const posts = norm(d.posts || d);
          if(posts.length) return posts;
        }catch(e){}
        return norm(await get('https://mlaasya07.substack.com/api/v1/archive?sort=new&limit=3'));

  function paintPosts(id, posts, profile){
    const ul = document.getElementById(id + '-posts');
    if(!ul) return;
    ul.innerHTML = '';
    if(!posts.length){
      const li = document.createElement('li');
      li.className = 'empty';
      const a = document.createElement('a');
      a.href = profile; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.setAttribute('data-direct', '');
      a.textContent = 'see latest posts →';
      a.style.color = 'var(--steel)';
      li.appendChild(a); ul.appendChild(li);
      return;
    }
    posts.forEach(p => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = p.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
      const t = document.createElement('span'); t.className = 'pt'; t.textContent = p.title;
      const d = document.createElement('span'); d.className = 'pd';
      const dt = new Date(p.date);
      d.textContent = isNaN(dt) ? '' : dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
      a.appendChild(t); a.appendChild(d); li.appendChild(a); ul.appendChild(li);
    });
  }

  function loadFeeds(){
    Object.entries(FEEDS).forEach(([id, f]) => {
      paintPosts(id, f.fallback, f.profile);
      f.load().then(posts => { if(posts && posts.length) paintPosts(id, posts, f.profile); }).catch(() => {});
    });
  }

  function setMeta(route){
    const url = SITE + pathFor(route);
    const set = (sel, attr, val) => { const el = document.querySelector(sel); if(el && val) el.setAttribute(attr, val); };
    set('link[rel="canonical"]', 'href', url);
    set('meta[property="og:url"]', 'content', url);
    set('meta[property="og:title"]', 'content', titles[route]);
    set('meta[property="og:description"]', 'content', descriptions[route]);
    set('meta[name="twitter:title"]', 'content', titles[route]);
    set('meta[name="twitter:description"]', 'content', descriptions[route]);
  }

  const SOCIAL = {
    'mailto:mlaasy16@gmail.com': {name:'Email', value:'mlaasy16@gmail.com', action:'Mail me', copy:'Copy email'},

  };
  const normHref = (h) => /^mailto:/i.test(h) ? h.toLowerCase() : h.replace(/\/+$/, '').toLowerCase();

  function fallbackCopy(t){
    return new Promise(res => {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      ta.remove(); res();
    });
  }
  function copyText(t){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
    return fallbackCopy(t);
  }
  function openShare(href, info){
    const ov = document.getElementById('shareOverlay');
    document.getElementById('shareTitle').textContent = info.name;
    document.getElementById('shareSub').textContent = info.value || href.replace(/^https?:\/\//, '');
    const go = document.getElementById('shareGo'), cp = document.getElementById('shareCopy');
    go.textContent = info.action;
    cp.textContent = info.copy || 'Copy link';
    go.onclick = () => {
      ov.classList.remove('open');
      if(/^mailto:/i.test(href)) location.href = href; else window.open(href, '_blank', 'noopener,noreferrer');
    };
    cp.onclick = () => copyText(info.value || href).then(() => { cp.textContent = 'Copied ✓'; setTimeout(() => ov.classList.remove('open'), 800); });
    ov.classList.add('open');
  }
  function initShare(){
    const ov = document.createElement('div');
    ov.className = 'share-overlay'; ov.id = 'shareOverlay';
    ov.innerHTML = '<div class="share-box" role="dialog" aria-modal="true"><div class="share-title" id="shareTitle"></div><div class="share-sub" id="shareSub"></div><button type="button" class="share-btn primary" id="shareGo"></button><button type="button" class="share-btn" id="shareCopy"></button></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => { if(e.target === ov) ov.classList.remove('open'); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') ov.classList.remove('open'); });
  }
  // capture phase so it runs before inline onclick handlers
  document.addEventListener('click', (e) => {
    if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const a = e.target.closest && e.target.closest('a[href]');
    if(!a || a.hasAttribute('data-direct')) return;
    const href = a.getAttribute('href');
    const info = SOCIAL[normHref(href)];
    if(info){ e.preventDefault(); e.stopPropagation(); openShare(href, info); return; }
    if(href.charAt(0) === '/' && href.charAt(1) !== '/'){ e.preventDefault(); navigate(href); }
  }, true);

  // ── contact form (Netlify Forms) ──
  window.sendContact = async function(e){

      st.style.color = 'var(--crimson)'; st.textContent = 'could not send right now. email me at mlaasy16@gmail.com instead.';

  function setActiveNav(route){
    document.querySelectorAll('#navLinks a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  }

  const SITE = 'https://mlaasya07.netlify.app';
  const HASH_MODE = location.protocol === 'file:';
  function pathFor(route){ return route === 'home' ? '/' : '/' + route; }
  function getRoute(){
    const h = HASH_MODE ? location.hash.replace(/^#\/?/, '') : location.pathname.replace(/^\/+|\/+$/g, '');
    if(h === '' || h === 'index.html') return 'home';
    return Object.prototype.hasOwnProperty.call(routes, h) ? h : '404';
  }
  function navigate(path){
    if(HASH_MODE){ location.hash = '#/' + (path.replace(/^\/+|\/+$/g, '') || 'home'); return; }
    if(path === location.pathname) return;
    history.pushState(null, '', path);
    render(getRoute(), true);
  }
  window.goRoute = (route) => navigate(pathFor(route));

  function render(route, animate){
    const root = document.getElementById('pageRoot');
    const go = () => {
      root.innerHTML = `<div class="${route==='home' ? '' : 'page-body'}">${routes[route]()}</div>`;
      afterRender(route);
      setActiveNav(route);
      document.title = titles[route] || 'Laasya';
      setMeta(route);
      const metaDesc = document.querySelector('meta[name="description"]');
      if(metaDesc && descriptions[route]) metaDesc.setAttribute('content', descriptions[route]);
      window.scrollTo({top:0, behavior:'instant'});
      requestAnimationFrame(() => requestAnimationFrame(() => {
        root.classList.remove('leaving','entering'); root.classList.add('shown');
      }));
    };
    if(!animate){ go(); return; }
    root.classList.remove('shown'); root.classList.add('leaving');
    setTimeout(go, 220);
  }

  window.addEventListener(HASH_MODE ? 'hashchange' : 'popstate', () => render(getRoute(), true));
  document.addEventListener('DOMContentLoaded', () => {
    if(!HASH_MODE && /^#\/\w+$/.test(location.hash)){ const r = location.hash.slice(2); if(routes[r]) history.replaceState(null, '', pathFor(r)); }
    render(getRoute(), false);
    document.getElementById('navToggle').addEventListener('click', () => {

    const preloader = document.getElementById('preloader');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function dismissPreloader(){ preloader.classList.add('hide'); }
    let seen = false; try{ seen = sessionStorage.getItem('booted') === '1'; }catch(e){}
    if(reduceMotion || seen){
      if(seen) preloader.style.display = 'none';
      dismissPreloader();

      typeTerminal(document.getElementById('preloaderBody'), [
        {cmd:"boot laasya.dev", out:"done"},
        {cmd:"npm run start", out:"portfolio ready ✓"},
      ], () => setTimeout(() => { try{ sessionStorage.setItem('booted', '1'); }catch(e){} dismissPreloader(); }, 400));
    }
  });

  // ── command palette ──────────────────────────────────
  const cmdkPages = [
    {label:"home", hint:"the bento landing page", route:"home"},
    {label:"resume", hint:"experience, projects, skills", route:"resume"},
    {label:"projects", hint:"everything I've shipped", route:"projects"},
    {label:"education", hint:"CR Rao AIMSCS, flip the card", route:"education"},
    {label:"blog", hint:"Substack, Medium &amp; poetry", route:"blog"},
    {label:"socials", hint:"GitHub, LinkedIn, and the rest", route:"socials"},
  ];
  let cmdkActive = 0;
  let cmdkFiltered = cmdkPages;

  function initCmdk(){
    const overlay = document.getElementById('cmdkOverlay');
    const input = document.getElementById('cmdkInput');
    const list = document.getElementById('cmdkList');

    function renderList(){
      list.innerHTML = cmdkFiltered.map((p, i) => `
        <div class="cmdk-item ${i===cmdkActive?'active':''}" data-route="${p.route}">
          <span>${p.label}</span><span class="hint">${p.hint}</span>
        </div>`).join('') || `<div class="cmdk-item" style="cursor:default;">no matching pages</div>`;
    }
    function open(){
      cmdkFiltered = cmdkPages; cmdkActive = 0; input.value = '';
      renderList();
      overlay.classList.add('open');
      setTimeout(() => input.focus(), 50);
    }
    function close(){ overlay.classList.remove('open'); }
    function go(route){ close(); goRoute(route); }

    document.getElementById('cmdkTrigger').addEventListener('click', open);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });

    input.addEventListener('input', () => {
      const q = input.value.toLowerCase();
      cmdkFiltered = cmdkPages.filter(p => p.label.includes(q) || p.hint.toLowerCase().includes(q));
      cmdkActive = 0;
      renderList();
    });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){ close(); }
      else if(e.key === 'ArrowDown'){ e.preventDefault(); cmdkActive = Math.min(cmdkActive+1, cmdkFiltered.length-1); renderList(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdkActive = Math.max(cmdkActive-1, 0); renderList(); }
      else if(e.key === 'Enter'){ if(cmdkFiltered[cmdkActive]) go(cmdkFiltered[cmdkActive].route); }
    });
    list.addEventListener('click', (e) => {
      const item = e.target.closest('.cmdk-item');
      if(item && item.dataset.route) go(item.dataset.route);
    });
    document.addEventListener('keydown', (e) => {
      if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault();
        overlay.classList.contains('open') ? close() : open();
      }
    });
  }
